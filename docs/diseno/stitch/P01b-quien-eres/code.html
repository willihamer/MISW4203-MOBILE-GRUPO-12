<!-- SCRIPT DE MICRO-INTERACCIÓN TÁCTIL (Selección fluida de coleccionistas) -->
<script>
    (function() {
      const cards = document.querySelectorAll('.collector-card');
      const continueBtn = document.getElementById('btn-continuar');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => {
            c.setAttribute('data-selected', 'false');
            c.setAttribute('aria-checked', 'false');
            c.className = 'collector-card relative group cursor-pointer w-full rounded-2xl p-3.5 flex items-center justify-between transition-all duration-300 bg-surface-glass hover:bg-surface-glass-strong';
            c.style.boxShadow = 'inset 0 1px 1px rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.08)';
            
            const indicator = c.querySelector('.check-indicator');
            if (indicator) {
              indicator.className = 'check-indicator w-8 h-8 rounded-full bg-surface-glass-strong flex-shrink-0 flex items-center justify-center text-outline transition-all';
              indicator.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-white/20"></div>';
            }
          });

          // Activar el seleccionado
          card.setAttribute('data-selected', 'true');
          card.setAttribute('aria-checked', 'true');
          card.className = 'collector-card relative group cursor-pointer w-full rounded-2xl p-3.5 flex items-center justify-between transition-all duration-300 bg-surface-bright/70 backdrop-blur-md';
          card.style.boxShadow = 'inset 0 1px 1px rgba(255,255,255,0.4), 0 0 0 1.5px #2fd9f4, 0 8px 24px -4px rgba(47, 217, 244, 0.3)';

          const activeIndicator = card.querySelector('.check-indicator');
          if (activeIndicator) {
            activeIndicator.className = 'check-indicator w-8 h-8 rounded-full bg-secondary flex-shrink-0 flex items-center justify-center text-on-secondary shadow-[0_0_16px_rgba(93,230,255,0.85)] transition-transform duration-200 scale-105';
            activeIndicator.innerHTML = '<span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: \'FILL\' 1, \'wght\' 700;">check</span>';
          }
        });
      });

      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          continueBtn.classList.add('scale-95');
          setTimeout(() => continueBtn.classList.remove('scale-95'), 150);
        });
      }
    })();
  </script>
