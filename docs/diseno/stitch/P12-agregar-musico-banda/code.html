      Cancelar

<!-- Confirm Button -->
<button class="flex-1 h-12 rounded-full bg-gradient-to-r from-primary-container to-secondary text-white font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(124,58,237,0.45)] transition-all duration-150 active:scale-95" id="submit-musicians-btn" onclick="handleConfirmAddition()" type="button">
<span class="">Agregar a la banda</span>
<span class="material-symbols-outlined text-[18px]">done_all</span>

<!-- Interactive Logic -->
<script>
    function updateSelectedCount() {
      const rows = document.querySelectorAll('.musician-row');
      let count = 0;
      rows.forEach(row => {
        if (row.getAttribute('data-selected') === 'true') {
          count++;
        }
      });
      const countLabel = document.getElementById('selected-count');
      if (countLabel) countLabel.textContent = count;
    }

    function toggleMusician(rowElement) {
      const isSelected = rowElement.getAttribute('data-selected') === 'true';
      const checkbox = rowElement.querySelector('.checkbox-indicator');
      const checkIcon = checkbox.querySelector('.material-symbols-outlined');
      const avatarBorder = rowElement.querySelector('img').parentElement;
      const avatarImg = rowElement.querySelector('img');
      const roleText = rowElement.querySelector('.font-caption');

      if (isSelected) {
        // Deselect
        rowElement.setAttribute('data-selected', 'false');
        rowElement.classList.remove('bg-surface-glass-strong', 'shadow-[0_4px_20px_rgba(0,0,0,0.25)]');
        rowElement.classList.add('bg-surface-glass');

        checkbox.classList.remove('bg-gradient-to-br', 'from-primary-container', 'to-secondary', 'shadow-[0_0_16px_rgba(124,58,237,0.6)]');
        checkbox.classList.add('bg-surface-glass');
        checkIcon.classList.remove('text-on-primary');
        checkIcon.classList.add('text-transparent');

        avatarBorder.classList.remove('bg-gradient-to-tr', 'from-primary-container', 'via-secondary', 'to-primary', 'shadow-[0_0_12px_rgba(124,58,237,0.35)]');
        avatarBorder.classList.add('bg-surface-container-highest');
        avatarImg.classList.add('opacity-80');

        roleText.classList.remove('text-secondary');
        roleText.classList.add('text-on-surface-muted');
      } else {
        // Select
        rowElement.setAttribute('data-selected', 'true');
        rowElement.classList.add('bg-surface-glass-strong', 'shadow-[0_4px_20px_rgba(0,0,0,0.25)]');
        rowElement.classList.remove('bg-surface-glass');

        checkbox.classList.add('bg-gradient-to-br', 'from-primary-container', 'to-secondary', 'shadow-[0_0_16px_rgba(124,58,237,0.6)]');
        checkbox.classList.remove('bg-surface-glass');
        checkIcon.classList.add('text-on-primary');
        checkIcon.classList.remove('text-transparent');

        avatarBorder.classList.add('bg-gradient-to-tr', 'from-primary-container', 'via-secondary', 'to-primary', 'shadow-[0_0_12px_rgba(124,58,237,0.35)]');
        avatarBorder.classList.remove('bg-surface-container-highest');
        avatarImg.classList.remove('opacity-80');

        roleText.classList.add('text-secondary');
        roleText.classList.remove('text-on-surface-muted');
      }
      updateSelectedCount();
    }

    // Dynamic Filter
    const searchInput = document.getElementById('musician-search');
    const clearBtn = document.getElementById('clear-search-btn');

    if (searchInput) {
      searchInput.addEventListener('input', function(e) {
        const val = e.target.value.toLowerCase().trim();
        if (val.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }

        const rows = document.querySelectorAll('.musician-row');
        rows.forEach(row => {
          const name = row.querySelector('.font-title-md').textContent.toLowerCase();
          const subtitle = row.querySelector('.font-caption').textContent.toLowerCase();
          if (name.includes(val) || subtitle.includes(val)) {
            row.style.display = 'flex';
          } else {
            row.style.display = 'none';
          }
        });
      });
    }

    function handleConfirmAddition() {
      const btn = document.getElementById('submit-musicians-btn');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Guardando...</span>';
      setTimeout(() => {
        history.back();
      }, 500);
    }
  </script>
