imary-container"><div class="fixed top-12 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full bg-primary-container/15 blur-[120px] pointer-events-none z-0"></div><div class="fixed bottom-0 right-0 w-80 h-80 rounded-full bg-secondary/10 blur-[100px] pointer-events-none z-0"></div><main class="flex flex-col relative w-full min-h-screen bg-transparent z-10"><div class="flex flex-col w-full px-margin pb-32">

<div class="flex items-center gap-space-sm">
<button aria-label="Volver" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-glass backdrop-blur-md shadow-md active:scale-95 transition-transform text-on-surface" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface truncate">Nuevo álbum</h1>
</div>
<!-- Collector Profile Chip -->
<div class="relative flex items-center justify-center w-10 h-10 rounded-full bg-surface-glass backdrop-blur-md shadow-sm font-label-md font-bold text-on-surface text-[14px]">MG<span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-success border-2 border-[#0A0A14]"></span></div>

<svg class="absolute inset-0 w-full h-full opacity-40" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="46" stroke="#ffffff" stroke-dasharray="2 1" stroke-width="0.5"></circle>
<circle cx="50" cy="50" fill="none" r="40" stroke="#ffffff" stroke-width="0.4"></circle>
<circle cx="50" cy="50" fill="none" r="34" stroke="#ffffff" stroke-dasharray="3 1.5" stroke-width="0.5"></circle>
<circle cx="50" cy="50" fill="none" r="28" stroke="#ffffff" stroke-width="0.3"></circle>
<circle cx="50" cy="50" fill="none" r="22" stroke="#ffffff" stroke-width="0.5"></circle>
</svg>
<!-- Center Label -->

<span class="text-[7px] font-bold text-on-surface tracking-tighter uppercase font-headline-md">33 RPM</span>
<div class="w-2.5 h-2.5 rounded-full bg-vinyl-black mt-0.5"></div>
</div>
</div>

<div class="relative z-10 flex flex-col items-center justify-center bg-vinyl-black/60 backdrop-blur-sm rounded-lg p-1.5 w-full h-full">
<span class="material-symbols-outlined text-primary text-[24px]">album</span>
<span class="font-caption text-caption text-on-surface-variant mt-1 leading-tight font-medium">Vista previa de carátula</span>
</div>
</div>
</div>
<!-- Meta Live Tagging Preview -->
<div class="flex flex-col justify-center min-w-0 flex-1"><h2 class="font-title-lg text-title-lg text-on-surface truncate">Título del Álbum</h2><div class="flex items-center gap-space-xs mt-2"><span class="font-label-md text-label-md px-2 py-0.5 rounded-md bg-surface-container-low text-on-surface-variant">Salsa</span><span class="font-caption text-caption text-on-surface-muted">·</span><span class="font-caption text-caption text-on-surface-muted">Elektra</span></div></div>
</div>
</div>
</section>
<!-- Interactive Form Fields -->
<form class="flex flex-col gap-space-md w-full" onsubmit="event.preventDefault();">

<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-muted" for="album-name">Nombre del álbum <span class="text-error">*</span></label>
<span class="font-caption text-caption text-error font-medium">Requerido</span>
</div>
<div class="relative flex items-center w-full">
<input aria-describedby="album-name-error" aria-invalid="true" class="w-full h-[52px] px-space-md rounded-xl bg-surface-glass backdrop-blur-md text-on-surface placeholder:text-on-surface-variant/40 font-body-lg text-body-lg focus:outline-none shadow-[0_0_16px_rgba(248,113,113,0.35)] shadow-error/20" id="album-name" placeholder="Ej. Siembra, Buscando América..." type="text" value="">
<div class="absolute right-space-md text-error flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[22px]">error</span>

</div>

<input class="w-full h-[52px] pl-space-md pr-11 rounded-xl bg-surface-glass backdrop-blur-md text-on-surface placeholder:text-on-surface-variant/40 font-body-lg text-body-lg focus:outline-none focus:shadow-[0_0_16px_rgba(34,211,238,0.35)] transition-shadow" id="cover-url" placeholder="https://ejemplo.com/portada.jpg" type="url">
<div class="absolute right-space-md text-on-surface-variant/60 flex items-center pointer-events-none">

</div>
</div>
<!-- Field: Fecha de lanzamiento (Android Date Trigger Look) -->

<div class="flex items-center gap-space-sm">

<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-secondary">

</div>

<option class="bg-surface-container-high text-on-surface" value="Folk">Folk</option>
<option class="bg-surface-container-high text-on-surface" value="Classical">Classical</option>
</select>
<div class="absolute right-space-md top-1/2 -translate-y-1/2 text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[22px]">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Field: Sello discográfico Dropdown -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-muted px-1" for="label-select">Sello discográfico <span class="text-error">*</span></label>
<div class="relative w-full">
<select class="w-full h-[52px] px-space-md rounded-xl bg-surface-glass backdrop-blur-md text-on-surface font-body-lg text-body-lg appearance-none focus:outline-none focus:shadow-[0_0_16px_rgba(34,211,238,0.35)] pr-12 cursor-pointer transition-shadow" id="label-select"><option class="bg-surface-container-high text-on-surface" value="Sony Music">Sony Music</option><option class="bg-surface-container-high text-on-surface" value="EMI">EMI</option><option class="bg-surface-container-high text-on-surface" value="Discos Fuentes">Discos Fuentes</option><option class="bg-surface-container-high text-on-surface" selected="" value="Elektra">Elektra</option><option class="bg-surface-container-high text-on-surface" value="Fania Records">Fania Records</option></select>
<div class="absolute right-space-md top-1/2 -translate-y-1/2 text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[22px]">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Field: Descripción del álbum (Multiline Glass Textarea) -->
<div class="flex flex-col gap-1.5 w-full">
<div class="flex justify-between items-center px-1"><label class="font-label-md text-label-md text-on-surface-muted" for="album-desc">Descripción del álbum <span class="text-error">*</span></label></div>
<div class="relative w-full">
<textarea class="w-full p-space-md rounded-xl bg-surface-glass backdrop-blur-md text-on-surface placeholder:text-on-surface-variant/40 font-body-lg text-body-lg focus:outline-none focus:shadow-[0_0_16px_rgba(124,58,237,0.35)] transition-shadow resize-none" id="album-desc" placeholder="Reseña histórica, estilo musical o notas de producción..." rows="3"></textarea>

</div>

<div class="flex items-center gap-space-md mt-space-md pt-space-xs">
<!-- Cancelar (Secondary Pill) -->

        Cancelar
      </button>
<!-- Guardar álbum (Primary Gradient Pill) -->
<button class="h-12 rounded-full bg-gradient-to-r from-primary-container to-secondary text-on-surface font-title-md text-title-md font-bold flex items-center justify-center gap-space-xs shadow-[0_0_24px_rgba(124,58,237,0.45)] active:scale-95 transition-all flex-1" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>

</button>
</div>
</form>
</div></main>
