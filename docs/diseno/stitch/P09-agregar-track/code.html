<!DOCTYPE html><html class="dark" lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0A0A14;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline-variant": "#4a4455", "primary": "#d2bbff", "on-tertiary-container": "#ffdde7", "accent-warm": "#F59E0B", "on-tertiary-fixed": "#3e0022", "on-error": "#690005", "on-tertiary": "#640039", "vinyl-black": "#0E0E12", "tertiary-fixed": "#ffd9e4", "inverse-surface": "#e4e1f0", "on-secondary-fixed": "#001f25", "surface-bright": "#393844", "secondary-fixed": "#a2eeff", "on-primary": "#3f008e", "secondary-fixed-dim": "#2fd9f4", "on-background": "#e4e1f0", "on-primary-container": "#ede0ff", "tertiary": "#ffb0cd", "secondary": "#5de6ff", "surface-container-low": "#1b1b25", "inverse-primary": "#732ee4", "surface-glass": "rgba(255, 255, 255, 0.10)", "border-highlight": "rgba(255, 255, 255, 0.35)", "on-surface": "#e4e1f0", "on-secondary-container": "#00515d", "on-tertiary-fixed-variant": "#8c0053", "on-secondary": "#00363e", "border-glass": "rgba(255, 255, 255, 0.18)", "surface": "#12121d", "error-container": "#93000a", "error": "#F87171", "surface-container": "#1f1f29", "on-primary-fixed": "#25005a", "surface-glass-strong": "rgba(255, 255, 255, 0.16)", "surface-variant": "#34343f", "primary-fixed-dim": "#d2bbff", "on-surface-variant": "#ccc3d8", "on-surface-muted": "#C4C4D4", "on-primary-fixed-variant": "#5a00c6", "success": "#34D399", "tertiary-fixed-dim": "#ffb0cd", "secondary-container": "#00cbe6", "on-secondary-fixed-variant": "#004e5a", "inverse-on-surface": "#302f3b", "surface-tint": "#d2bbff", "primary-fixed": "#eaddff", "tertiary-container": "#bf2076", "surface-container-lowest": "#0d0d17", "on-error-container": "#ffdad6", "surface-container-high": "#292934", "primary-container": "#7c3aed", "surface-dim": "#12121d", "outline": "#958da1", "background": "#12121d", "surface-container-highest": "#34343f" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "gutter": "1rem", "space-md": "1rem", "margin": "1rem", "space-xl": "2rem", "space-sm": "0.5rem", "space-xs": "0.25rem" }, fontFamily: { "body-md": ["Inter"], "label-md": ["Inter"], "caption": ["Inter"], "label-lg": ["Inter"], "headline-md": ["Sora"], "headline-lg": ["Sora"], "title-lg": ["Sora"], "title-md": ["Inter"], "body-lg": ["Inter"], "display-lg": ["Sora"] }, fontSize: { "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500" }], "caption": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "400" }], "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "title-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } }</script></head><body class="bg-[#0A0A14] text-on-surface relative min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container"><div class="fixed top-12 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full bg-primary-container/15 blur-[120px] pointer-events-none z-0"></div><div class="fixed bottom-0 right-0 w-80 h-80 rounded-full bg-secondary/10 blur-[100px] pointer-events-none z-0"></div><main class="flex flex-col relative w-full min-h-screen bg-transparent z-10"><div class="flex flex-col w-full relative min-h-[820px] overflow-hidden select-none">
<!-- Backing blurred context: Album Detail Sheet Preview -->
<div class="absolute inset-0 flex flex-col p-4 opacity-40 blur-[8px] pointer-events-none scale-95 origin-top transition-transform duration-300">
<!-- Mock Album Card with vinyl peeking -->
<div class="relative w-full aspect-square max-w-[280px] mx-auto mt-6 flex items-center justify-center">
<!-- Vinyl record peek -->
<div class="absolute right-2 w-52 h-52 rounded-full bg-vinyl-black shadow-2xl flex items-center justify-center translate-x-10">
<div class="w-44 h-44 rounded-full border border-white/5 flex items-center justify-center">
<div class="w-32 h-32 rounded-full border border-white/5 flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-primary-container/80 flex items-center justify-center">
<div class="w-4 h-4 rounded-full bg-surface-container-lowest"></div>
</div>
</div>
</div>
</div>
<!-- Album Sleeve -->
<div class="relative z-10 w-56 h-56 rounded-2xl overflow-hidden shadow-2xl bg-surface-container-high">
<img class="w-full h-full object-cover" data-alt="Album cover for Buscando América by Rubén Blades, vintage Latin jazz vinyl artwork, cinematic high contrast, warm amber spotlight on microphone, midnight violet accents and fine analog grain texture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3pffqkAt7sahRygjHyCXEHELEe-nkN7jwxBNp19581X9tE8_F_S1dm-qPVjsHsFkpvc2jY2GD6CTNG5nrKQE3Zs0CfyuOpUEraRjCUkMAZVJrVcA5grVD7KsohbjvALCqmw5KpxWy76T_9GRn2OPoGcXMQXEr4bS9fZneXPibLnj6LlJRAP1GTJO-JHANdq-TS9vsC_0Ae46Y-vrP5ECCPUcqA1itk0Kg7XsVZVHXLLIKYlhy7Ac">
</div>
</div>
<!-- Album Info Preview -->
<div class="mt-8 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Buscando América</h2>
<p class="font-body-md text-body-md text-on-surface-muted mt-1">Rubén Blades y Seis del Solar • 1984</p>
</div>
<!-- Tracklist Mock Items -->
<div class="mt-6 space-y-3 px-2">
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-glass">
<div class="flex items-center gap-3">
<span class="font-label-md text-label-md text-on-surface-muted">01</span>
<span class="font-body-md text-body-md text-on-surface">Decisiones</span>
</div>
<span class="font-caption text-caption text-on-surface-muted">05:00</span>
</div>
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-glass">
<div class="flex items-center gap-3">
<span class="font-label-md text-label-md text-on-surface-muted">02</span>
<span class="font-body-md text-body-md text-on-surface">GDBD</span>
</div>
<span class="font-caption text-caption text-on-surface-muted">03:35</span>
</div>
</div>
</div>
<!-- Modal Dark Scrim Overlay (50% black + backdrop blur) -->
<div class="absolute inset-0 bg-black/50 backdrop-blur-md z-20 transition-opacity duration-300" id="modal-backdrop"></div>
<!-- Bottom Sheet Modal Container (aligned to ~40% top offset) -->
<div class="relative z-30 flex flex-col justify-end w-full min-h-[820px] pt-28">
<div class="w-full bg-[#12121d]/90 backdrop-blur-2xl rounded-t-[32px] shadow-2xl p-6 pb-10 flex flex-col relative border-t border-white/20 shadow-[0_-12px_40px_rgba(0,0,0,0.6)]" id="bottom-sheet">
<!-- Top Drag Handle & Dismiss Header -->
<div class="w-full flex items-center justify-between mb-4">
<!-- Spacer for visual symmetry -->
<div class="w-10 h-10"></div>
<!-- Center Drag Handle -->
<div class="flex flex-col items-center cursor-grab active:cursor-grabbing py-1" id="sheet-handle">
<div class="w-10 h-1.5 rounded-full bg-white/30 hover:bg-white/50 transition-colors"></div>
</div>
<!-- Close X Button -->
<button aria-label="Cerrar modal" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all flex items-center justify-center text-on-surface cursor-pointer focus:outline-none" id="btn-close" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Sheet Header Content -->
<div class="flex flex-col mb-6">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(93,230,255,0.8)]"></span>
<span class="font-label-md text-label-md text-secondary tracking-wide uppercase">Nueva Entrada</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mt-1">Agregar track</h1>
<p class="font-body-md text-body-md text-on-surface-muted mt-0.5">Buscando América • Rubén Blades</p>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-5" id="add-track-form" onsubmit="event.preventDefault();">
<!-- Field 1: Nombre del track -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-muted flex items-center justify-between" for="track-name"><span class="">Nombre del track <span class="text-primary">*</span></span>
<span class="font-caption text-caption text-primary/70">Requerido</span></label>
<div class="relative flex items-center">
<input autocomplete="off" class="w-full h-[52px] px-4 rounded-2xl bg-white/[0.07] text-on-surface placeholder:text-on-surface-muted/50 font-body-md text-body-md focus:outline-none focus:bg-white/[0.12] focus:shadow-[0_0_20px_rgba(93,230,255,0.25)] transition-all" id="track-name" placeholder="Ej. Desapariciones" type="text">
<span class="material-symbols-outlined absolute right-4 text-on-surface-muted/60 pointer-events-none text-[22px]">music_note</span>
</div>
</div>
<!-- Field 2: Duración -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-muted flex items-center justify-between" for="track-duration"><span class="">Duración <span class="text-primary">*</span></span>
<span class="font-caption text-caption text-primary/70">Requerido</span></label>
<div class="relative flex items-center">
<input autocomplete="off" class="w-full h-[52px] pl-4 pr-12 rounded-2xl bg-white/[0.07] text-on-surface placeholder:text-on-surface-muted/50 font-body-md text-body-md focus:outline-none focus:bg-white/[0.12] focus:shadow-[0_0_20px_rgba(93,230,255,0.25)] transition-all" id="track-duration" maxlength="5" placeholder="Ej. 04:35" type="text">
<span class="material-symbols-outlined absolute right-4 text-on-surface-muted/60 pointer-events-none text-[22px]">schedule</span>
</div>
<div class="flex items-center gap-1.5 px-1">
<span class="material-symbols-outlined text-[14px] text-on-surface-muted/70">info</span>
<span class="font-caption text-caption text-on-surface-muted/70">Formato mm:ss</span>
</div>
</div>
<!-- Sheet Action Buttons -->
<div class="flex flex-row items-center gap-3 mt-4 pt-2 w-full">
<!-- Cancel Button -->
<button class="flex-1 w-1/2 h-12 rounded-full bg-white/[0.08] hover:bg-white/[0.14] active:scale-[0.98] transition-all flex items-center justify-center font-label-lg text-label-lg text-on-surface cursor-pointer focus:outline-none" id="btn-cancel" type="button">
            Cancelar
          </button>
<!-- Add Button (Gradient with chromatic glow) -->
<button class="flex-1 w-1/2 h-12 rounded-full bg-gradient-to-r from-[#7C3AED] to-[#22D3EE] hover:opacity-95 active:scale-[0.98] shadow-[0_0_24px_rgba(124,58,237,0.45)] transition-all flex items-center justify-center font-label-lg text-label-lg text-white font-semibold cursor-pointer focus:outline-none gap-1.5" id="btn-submit" type="button">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
<span class="">Agregar</span>
</button>
</div>
</form>
<!-- Feedback Toast (Hidden initially) -->
<div class="absolute -top-14 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-surface-container-high/90 backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-2 pointer-events-none opacity-0 translate-y-2 transition-all duration-300" id="toast-success">
<span class="material-symbols-outlined text-success text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-surface">Track añadido a la colección</span>
</div>
</div>
</div>
<script>
    (function() {
      const sheet = document.getElementById('bottom-sheet');
      const backdrop = document.getElementById('modal-backdrop');
      const btnClose = document.getElementById('btn-close');
      const btnCancel = document.getElementById('btn-cancel');
      const btnSubmit = document.getElementById('btn-submit');
      const toast = document.getElementById('toast-success');
      const durationInput = document.getElementById('track-duration');
      const nameInput = document.getElementById('track-name');

      // Auto-formatting mm:ss for duration input
      if (durationInput) {
        durationInput.addEventListener('input', function(e) {
          let val = e.target.value.replace(/[^0-9]/g, '');
          if (val.length > 2) {
            val = val.substring(0, 2) + ':' + val.substring(2, 4);
          }
          e.target.value = val;
        });
      }

      function dismissModal() {
        if (!sheet || !backdrop) return;
        sheet.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s';
        backdrop.style.transition = 'opacity 0.25s ease';
        sheet.style.transform = 'translateY(100%)';
        backdrop.style.opacity = '0';
        setTimeout(() => {
          sheet.style.transform = 'translateY(0)';
          backdrop.style.opacity = '1';
        }, 2200);
      }

      if (btnClose) btnClose.addEventListener('click', dismissModal);
      if (btnCancel) btnCancel.addEventListener('click', dismissModal);
      if (backdrop) backdrop.addEventListener('click', dismissModal);

      if (btnSubmit) {
        btnSubmit.addEventListener('click', function() {
          const trackTitle = nameInput ? nameInput.value.trim() : '';
          if (!trackTitle && nameInput) {
            nameInput.focus();
            nameInput.classList.add('bg-error/10');
            setTimeout(() => nameInput.classList.remove('bg-error/10'), 1000);
            return;
          }

          // Trigger delight toast
          if (toast) {
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
              toast.classList.remove('opacity-100', 'translate-y-0');
              toast.classList.add('opacity-0', 'translate-y-2');
              setTimeout(dismissModal, 400);
            }, 1200);
          }
        });
      }
    })();
  </script>
</div></main>

</body></html>
