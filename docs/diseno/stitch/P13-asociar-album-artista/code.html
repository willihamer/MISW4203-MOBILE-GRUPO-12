<script>
  function selectAlbum(cardElement) {
    const list = document.getElementById('album-options-list');
    const allCards = list.querySelectorAll('.album-card');
    
    allCards.forEach(card => {
      card.setAttribute('aria-checked', 'false');
      card.classList.remove('bg-surface-container/70');
      card.classList.add('bg-surface-container-low/60');
      card.style.boxShadow = '';
      
      const indicator = card.querySelector('.radio-indicator');
      indicator.classList.remove('bg-surface-container-highest');
      indicator.classList.add('bg-surface-container-high');
      indicator.style.boxShadow = '';
      
      const inner = card.querySelector('.radio-inner');
      inner.style.background = 'transparent';
    });

    // Set selected on current
    cardElement.setAttribute('aria-checked', 'true');
    cardElement.classList.remove('bg-surface-container-low/60');
    cardElement.classList.add('bg-surface-container/70');
    cardElement.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.35), 0 0 14px rgba(124, 58, 237, 0.25)';

    const activeIndicator = cardElement.querySelector('.radio-indicator');
    activeIndicator.classList.remove('bg-surface-container-high');
    activeIndicator.classList.add('bg-surface-container-highest');
    activeIndicator.style.boxShadow = '0 0 16px rgba(93, 230, 255, 0.45)';

    const activeInner = cardElement.querySelector('.radio-inner');
    activeInner.style.background = 'linear-gradient(135deg, #7C3AED 0%, #22D3EE 100%)';
  }

  function handleAssociateAlbum() {
    const list = document.getElementById('album-options-list');
    const selected = list.querySelector('[aria-checked="true"]');
    const albumTitle = selected ? selected.querySelector('.font-title-md').textContent : 'Álbum';

    const toast = document.getElementById('success-toast');
    const toastMsg = document.getElementById('toast-message');
    toastMsg.textContent = `"${albumTitle}" asociado a Rubén Blades`;

    toast.classList.remove('hidden');
    // Micro animation
    requestAnimationFrame(() => {
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
    });

    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'translate-y-3');
      setTimeout(() => {
        toast.classList.add('hidden');
        if (window.history.length > 1) {
          history.back();
        }
      }, 300);
    }, 1600);
  }

  // Interactive live search filter
  const searchInput = document.getElementById('album-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.album-card');
      cards.forEach(card => {
        const title = card.querySelector('.font-title-md').textContent.toLowerCase();
        const year = card.querySelector('.font-body-md').textContent.toLowerCase();
        if (title.includes(q) || year.includes(q)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    });
  }
