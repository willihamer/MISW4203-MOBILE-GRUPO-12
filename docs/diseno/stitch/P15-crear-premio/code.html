<!DOCTYPE html><html class="dark" lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#12121d;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-container": "#ffdde7", "outline": "#958da1", "primary-fixed": "#eaddff", "surface-dim": "#12121d", "vinyl-black": "#0E0E12", "success": "#34D399", "surface": "#12121d", "on-primary": "#3f008e", "on-surface": "#e4e1f0", "primary": "#d2bbff", "on-primary-fixed": "#25005a", "on-secondary-container": "#00515d", "on-primary-container": "#ede0ff", "inverse-primary": "#732ee4", "surface-tint": "#d2bbff", "secondary": "#5de6ff", "outline-variant": "#4a4455", "tertiary-container": "#bf2076", "secondary-container": "#00cbe6", "on-tertiary-fixed-variant": "#8c0053", "on-secondary-fixed": "#001f25", "on-background": "#e4e1f0", "on-secondary": "#00363e", "surface-container": "#1f1f29", "surface-glass": "rgba(255, 255, 255, 0.10)", "surface-container-highest": "#34343f", "secondary-fixed": "#a2eeff", "surface-container-lowest": "#0d0d17", "background": "#12121d", "secondary-fixed-dim": "#2fd9f4", "inverse-on-surface": "#302f3b", "surface-bright": "#393844", "on-primary-fixed-variant": "#5a00c6", "on-error-container": "#ffdad6", "accent-warm": "#F59E0B", "on-surface-variant": "#ccc3d8", "error": "#F87171", "on-tertiary-fixed": "#3e0022", "border-highlight": "rgba(255, 255, 255, 0.35)", "on-surface-muted": "#C4C4D4", "on-secondary-fixed-variant": "#004e5a", "error-container": "#93000a", "tertiary-fixed": "#ffd9e4", "surface-glass-strong": "rgba(255, 255, 255, 0.16)", "surface-container-high": "#292934", "border-glass": "rgba(255, 255, 255, 0.18)", "inverse-surface": "#e4e1f0", "on-tertiary": "#640039", "tertiary": "#ffb0cd", "tertiary-fixed-dim": "#ffb0cd", "on-error": "#690005", "surface-variant": "#34343f", "surface-container-low": "#1b1b25", "primary-container": "#7c3aed", "primary-fixed-dim": "#d2bbff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "gutter": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-md": "1rem", "space-xl": "2rem" }, fontFamily: { "caption": ["Inter"], "title-md": ["Inter"], "headline-lg": ["Sora"], "label-md": ["Inter"], "headline-md": ["Sora"], "title-lg": ["Sora"], "display-lg": ["Sora"], "body-lg": ["Inter"], "label-lg": ["Inter"], "body-md": ["Inter"] }, fontSize: { "caption": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col relative overflow-x-hidden"><div class="fixed inset-0 bg-surface/70 backdrop-blur-md pointer-events-none z-0"></div><div class="fixed top-12 left-1/4 w-72 h-72 rounded-full bg-primary-container/20 blur-[100px] pointer-events-none z-0"></div><div class="fixed bottom-10 right-1/4 w-72 h-72 rounded-full bg-secondary-container/15 blur-[100px] pointer-events-none z-0"></div><div class="relative z-10 min-h-screen flex flex-col justify-end pt-[12vh]"><div class="flex-1 flex flex-col w-full rounded-t-[32px] bg-surface-glass-strong backdrop-blur-2xl shadow-[0_-8px_32px_rgba(0,0,0,0.6)]"><div class="pt-3 pb-2 flex flex-col items-center justify-center shrink-0"><div class="w-9 h-1 rounded-full bg-white/30 mb-2"></div><div class="w-full px-margin flex items-center justify-between"><h2 class="font-headline-md text-headline-md text-on-surface tracking-tight truncate">Nuevo premio</h2><button aria-label="Cerrar" class="w-11 h-11 rounded-full bg-surface-glass flex items-center justify-center text-on-surface transition-all active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button></div></div><main class="flex-1 flex flex-col relative w-full px-margin pb-safe pt-space-xs overflow-y-auto"><div class="flex flex-col w-full relative">
<!-- Interactive Form Container -->
<form class="flex flex-col w-full space-y-space-md" id="award-form" onsubmit="event.preventDefault(); triggerSubmitFeedback();">
<!-- Micro-hint Banner -->

<!-- Field 1: Nombre -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center" for="award-name">
<span class="">Nombre</span>
<span class="text-tertiary ml-1 font-bold">*</span>
</label>
<div class="relative flex items-center rounded-2xl bg-surface-glass focus-within:bg-surface-glass-strong focus-within:shadow-[0_0_16px_rgba(34,211,238,0.25)] transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px] ml-4 shrink-0 pointer-events-none">military_tech</span>
<input class="w-full h-[52px] bg-transparent pl-3 pr-4 text-on-surface placeholder:text-outline/60 font-body-md text-body-md focus:outline-none" id="award-name" name="name" placeholder="Ej. Grammy Award al Mejor Álbum Tropical" required="" type="text">
</div>
</div>
<!-- Field 2: Organización -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center" for="award-org">
<span class="">Organización</span>
<span class="text-tertiary ml-1 font-bold">*</span>
</label>
<div class="relative flex items-center rounded-2xl bg-surface-glass focus-within:bg-surface-glass-strong focus-within:shadow-[0_0_16px_rgba(34,211,238,0.25)] transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px] ml-4 shrink-0 pointer-events-none">corporate_fare</span>
<input class="w-full h-[52px] bg-transparent pl-3 pr-4 text-on-surface placeholder:text-outline/60 font-body-md text-body-md focus:outline-none" id="award-org" name="organization" placeholder="Ej. The Recording Academy" required="" type="text">
</div>
</div>
<!-- Field 3: Descripción -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="award-desc">
<span class="flex items-center">
<span class="">Descripción</span>
<span class="text-tertiary ml-1 font-bold">*</span>
</span>

</label>
<div class="relative rounded-2xl bg-surface-glass focus-within:bg-surface-glass-strong focus-within:shadow-[0_0_16px_rgba(34,211,238,0.25)] transition-all duration-200 p-3">
<textarea class="w-full bg-transparent text-on-surface placeholder:text-outline/60 font-body-md text-body-md resize-none focus:outline-none" id="award-desc" maxlength="300" name="description" oninput="document.getElementById('char-counter').textContent = `${this.value.length}/300`" placeholder="Detalla los criterios del galardón, impacto cultural o reseña histórica..." required="" rows="4"></textarea>
</div>
</div>
<!-- Badges / Micro-details Tag list for inspiration -->

<!-- Fixed/Pinned bottom action bar: strictly side-by-side, NEVER stacked -->
<div class="pt-space-md pb-2 mt-auto">
<div class="flex items-center gap-3 w-full">
<!-- Cancel Button -->
<button class="flex-1 h-12 rounded-full bg-surface-glass hover:bg-surface-glass-strong text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all active:scale-[0.98] shadow-sm select-none" onclick="history.back()" type="button">
          Cancelar
        </button>
<!-- Submit Button with chromatic gradient & violet glow -->
<button class="flex-1 h-12 rounded-full bg-gradient-to-r from-primary-container to-secondary text-surface-container-lowest font-label-lg text-label-lg font-semibold flex items-center justify-center transition-all active:scale-[0.98] shadow-[0_0_24px_rgba(124,58,237,0.45)] select-none" id="btn-submit" type="submit">
<span class="material-symbols-outlined text-[20px] mr-1.5">add_circle</span>
<span class="">Crear premio</span>
</button>
</div>
</div>
</form>
<!-- Success Toast Overlay -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2.5 px-4 py-3 rounded-full bg-surface-container-highest/95 backdrop-blur-xl shadow-[0_12px_32px_rgba(0,0,0,0.8)] opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3" id="toast-notification">
<div class="w-6 h-6 rounded-full bg-success/20 flex items-center justify-center text-success shrink-0">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface whitespace-nowrap">Premio registrado con éxito</span>
</div>
<script>
    function applyQuickTag(name, org) {
      const nameInput = document.getElementById('award-name');
      const orgInput = document.getElementById('award-org');
      if (nameInput && orgInput) {
        nameInput.value = name;
        orgInput.value = org;
        nameInput.focus();
      }
    }

    function triggerSubmitFeedback() {
      const btn = document.getElementById('btn-submit');
      const toast = document.getElementById('toast-notification');
      
      if (!btn || !toast) return;

      btn.disabled = true;
      btn.classList.add('opacity-80');
      
      // Reveal Toast
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
        setTimeout(() => {
          history.back();
        }, 300);
      }, 1400);
    }
  </script>
</div></main></div></div>

</body></html>
